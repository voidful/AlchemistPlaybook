name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional test dependency
        run: pip install pyyaml
      - name: Doc invariants (indexing, routing sync, archive freshness)
        run: python scripts/check_docs.py
      - name: Test suite (estimate.py, templates, doc consistency)
        run: python -m unittest discover -s tests -v
